<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조립팀 인사평가</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#dfe3e6; --line2:#c9cfd4; --text:#1f2933; --sub:#5f6b76;
  --blue:#1f6fb2; --blue-l:#e7f0f9; --orange:#d1662b; --green:#2e7d32; --green-l:#e8f5e9;
  --yellow:#fff4c2; --red:#c62828; --red-l:#fdecea; --gray-l:#f2f2f2; --head:#e2efda;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px}
button:hover{background:#f7f9fa}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#185c95}
button.green{background:var(--green);border-color:var(--green);color:#fff}
button.danger{color:var(--red);border-color:#e3b1b1}
button.small{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
textarea{resize:vertical;min-height:54px}
.wrap{max-width:1500px;margin:0 auto;padding:12px 16px 40px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0 8px 0 0}
.top .sp{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:7px 12px;border-radius:6px;color:var(--sub)}
.tabs button.on{background:var(--blue-l);color:var(--blue);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 8px}
.muted{color:var(--sub);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid-eval{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;gap:12px;align-items:start}
@media (max-width:1150px){.grid-eval{grid-template-columns:200px minmax(0,1fr)}.side{grid-column:1/-1}}
@media (max-width:760px){.grid-eval{grid-template-columns:1fr}}
.plist{max-height:calc(100vh - 150px);overflow:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pitem:hover{background:#f5f7f9}
.pitem.on{background:var(--blue-l);border-color:#b9d3ec}
.pitem .nm{flex:1;font-weight:600}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;background:#eceff1;color:var(--sub);white-space:nowrap}
.badge.done{background:var(--green-l);color:var(--green)}
.badge.draft{background:#fff3e0;color:#b25c00}
.badge.lead{background:#ede7f6;color:#5e35b1}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:middle}
th{background:var(--gray-l);font-weight:700;font-size:13px}
.score td{font-size:13px}
.score input{width:74px;text-align:center;font-weight:700}
.score .ref{white-space:nowrap}
.score .ref b{color:var(--blue);font-size:15px}
.score .why{color:var(--sub);font-size:12px}
.score tr.diff td{background:#fff8e1}
.score tr.diff input{border-color:#e0a000;background:#fffbe9}
.total{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:10px;font-size:15px}
.total b{font-size:22px;color:var(--blue)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.kv div:nth-child(odd){border-right:1px solid var(--line)}
.kv span:first-child{color:var(--sub)}
.kv span:last-child{font-weight:700}
.sect{font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.banner{padding:9px 12px;border-radius:8px;margin-bottom:10px;font-size:13px}
.banner.lock{background:var(--red-l);color:var(--red)}
.banner.info{background:var(--blue-l);color:#174e7c}
.banner.warn{background:#fff3e0;color:#8a4b00}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fields label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.fields .ro{padding:6px 8px;background:var(--gray-l);border-radius:6px;min-height:32px}
@media (max-width:760px){.fields{grid-template-columns:repeat(2,1fr)}}
.memo label{font-size:12px;color:var(--sub);display:block;margin:8px 0 3px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.hidden{display:none!important}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px}
.login h1{font-size:20px;margin:0 0 4px}
.login label{display:block;margin:14px 0 4px;font-size:13px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 18px;border-radius:8px;z-index:100;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal{background:#fff;border-radius:10px;max-width:1400px;width:100%;padding:16px;position:relative}
.modal .x{position:absolute;right:12px;top:10px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:90;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue)}
.edit td{padding:2px}
.edit input,.edit select{border:1px solid transparent;border-radius:4px;padding:4px 6px}
.edit input:focus,.edit select:focus{border-color:var(--blue)}
.edit tr:hover td{background:#fafbfc}
.scroll{overflow:auto}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:#eceff1;color:var(--sub)}
.hist details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.hist summary{padding:9px 12px;cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hist .body{padding:0 12px 12px}
/* ---------- 미리보기 (엑셀 양식) ---------- */
.pv{display:grid;grid-template-columns:760px 560px;gap:14px;font-family:"굴림",Gulim,"Malgun Gothic",sans-serif;font-size:12px;overflow:auto}
.pv table{table-layout:fixed}
.pv td,.pv th{border:1px solid #000;padding:3px 4px;text-align:center;font-size:12px;height:24px}
.pv .hd{background:var(--head);font-weight:700;font-size:14px}
.pv .lb{background:#dde8f3;font-weight:700}
.pv .gr{background:var(--gray-l);font-weight:700;white-space:nowrap;font-size:11px}
.pv .ye{background:#ffff00}
.pv .left{text-align:left}
.pv .sc{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:13px}
.pv .or{background:#ffc000}
.pv .bl{background:#bdd7ee}
.pv svg{border:1px solid #d9d9d9;background:#fff;display:block}
@media print{.top,.no-print{display:none!important}.overlay{position:static;background:none;padding:0}.modal{box-shadow:none;padding:0}}
</style>
</head>
<body>

<!-- ======================= 설정 ======================= -->
<script>
// ▼▼▼ 앱스 스크립트 배포 후 나온 "웹 앱 URL"을 따옴표 안에 붙여넣으세요 ▼▼▼
const API_URL = 'https://script.google.com/macros/s/AKfycbwz4jZQr8QpG7wS6s9nHH89bQhUIZqo2KCeC9RCIRUDZxGBy3k9fsik-X4H3udHjaeK/exec';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
</script>

<div id="loginView" class="login">
  <h1>조립팀 인사평가</h1>
  <div class="muted">파트를 선택하고 비밀번호를 입력하세요</div>
  <label>파트</label>
  <select id="loginPart"><option value="">불러오는 중…</option></select>
  <label>비밀번호</label>
  <input id="loginPw" type="password" autocomplete="current-password">
  <div style="margin-top:18px"><button class="primary" style="width:100%" id="loginBtn">들어가기</button></div>
  <div id="loginMsg" class="muted" style="margin-top:10px;color:var(--red)"></div>
</div>

<div id="appView" class="hidden">
  <div class="top"><div class="wrap">
    <h1>조립팀 인사평가</h1>
    <div class="tabs" id="tabs"></div>
    <div class="sp"></div>
    <label class="muted">평가월</label>
    <select id="monthSel" style="width:auto"></select>
    <span id="whoLabel" class="badge"></span>
    <button class="small" id="logoutBtn">로그아웃</button>
  </div></div>
  <div class="wrap" id="main"></div>
</div>

<div id="toast" class="toast"></div>
<div id="loading" class="loading hidden">처리 중…</div>

<script>
/* =====================================================================
   공통
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = v => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v === null || v === undefined) return null; const n = Number(String(v).replace(/[,%\s]/g,'')); return isFinite(n) ? n : null; };
const f1 = (v, d = 1) => { const n = num(v); return n === null ? '-' : (Math.round(n * 10 ** d) / 10 ** d).toString(); };
const pct = v => { const n = num(v); return n === null ? '-' : (n * 100).toFixed(1) + '%'; };
const dash = v => (v === null || v === undefined || v === '') ? '-' : v;
const SLOTS = 10;

let AUTH = null;        // {role, part, pw}
let META = null;        // {parts, current, months, locks, managers}
let STATE = { tab: null, month: null, part: null, data: null, sel: null, dirty: false };

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', err ? 4500 : 2200);
}
function busy(on) { $('#loading').classList.toggle('hidden', !on); }

async function api(action, body = {}, silent) {
  if (!API_URL) throw new Error('index.html 의 API_URL 이 비어 있습니다. 앱스 스크립트 웹 앱 URL 을 넣어주세요.');
  if (!silent) busy(true);
  try {
    const res = await fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, AUTH || {}, body))
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '오류');
    return j.data;
  } finally { if (!silent) busy(false); }
}

/* =====================================================================
   로그인
   ===================================================================== */
async function initLogin() {
  try {
    META = await api('meta', {}, true);
    const sel = $('#loginPart');
    sel.innerHTML = '<option value="">선택하세요</option>' +
      META.parts.map(p => `<option value="part:${esc(p.name)}">${esc(p.name)}${p.manager ? ' (' + esc(p.manager) + ')' : ''}</option>`).join('') +
      '<option value="admin">관리자</option>';
    const saved = sessionStorage.getItem('auth');
    if (saved) { AUTH = JSON.parse(saved); await doLogin(true); }
  } catch (e) {
    $('#loginPart').innerHTML = '<option value="">연결 실패</option>';
    $('#loginMsg').textContent = e.message;
  }
}

async function doLogin(auto) {
  if (!auto) {
    const v = $('#loginPart').value, pw = $('#loginPw').value;
    if (!v) { $('#loginMsg').textContent = '파트를 선택하세요'; return; }
    AUTH = v === 'admin' ? { role: 'admin', pw } : { role: 'part', part: v.slice(5), pw };
  }
  try {
    const r = await api('login');
    META = r.meta;
    AUTH.user = r.user; AUTH.admin = r.admin;
    try { sessionStorage.setItem('auth', JSON.stringify(AUTH)); } catch (e) {}
    $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
    $('#whoLabel').textContent = r.admin ? '관리자' : (AUTH.part + ' · ' + r.user);
    STATE.month = META.current || META.months[0];
    STATE.part = r.admin ? (META.parts[0] || {}).name : AUTH.part;
    buildMonthSel(); buildTabs();
    go(r.admin ? 'overview' : 'eval');
  } catch (e) {
    AUTH = null; try { sessionStorage.removeItem('auth'); } catch (x) {}
    $('#loginMsg').textContent = e.message;
  }
}

function logout() {
  if (STATE.dirty && !confirm('저장하지 않은 내용이 있습니다. 로그아웃할까요?')) return;
  try { sessionStorage.removeItem('auth'); } catch (e) {}
  location.reload();
}

function buildMonthSel() {
  const months = new Set(META.months || []);
  if (STATE.month) months.add(STATE.month);
  const list = [...months].sort().reverse();
  $('#monthSel').innerHTML = list.map(m => `<option value="${m}" ${m === STATE.month ? 'selected' : ''}>${m.replace('-', '년 ')}월${META.locks && META.locks[m] ? ' 🔒' : ''}</option>`).join('');
}

const TABS_ADMIN = [['overview', '현황'], ['eval', '평가 입력'], ['upload', '데이터 올리기'], ['config', '기준 설정'], ['roster', '명단·파트'], ['close', '마감·다운로드'], ['import', '기록 가져오기'], ['log', '수정기록']];
function buildTabs() {
  const t = $('#tabs');
  t.innerHTML = AUTH.admin ? TABS_ADMIN.map(([k, v]) => `<button data-tab="${k}">${v}</button>`).join('') : '';
  t.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.tab));
}

function go(tab) {
  if (STATE.dirty && !confirm('저장하지 않은 내용이 있습니다. 이동할까요?')) return;
  STATE.dirty = false; STATE.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({ overview: viewOverview, eval: viewEval, upload: viewUpload, config: viewConfig, roster: viewRoster, close: viewClose, import: viewImport, log: viewLog })[tab]();
}

/* =====================================================================
   평가 입력 (매니저 · 관리자)
   ===================================================================== */
async function viewEval(keepSel) {
  const main = $('#main');
  const partSel = AUTH.admin ? `<select id="partSel" style="width:auto">${META.parts.map(p => `<option ${p.name === STATE.part ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : `<b>${esc(STATE.part)}</b>`;
  main.innerHTML = `<div class="row" style="margin-bottom:10px">${partSel}<span class="muted" id="evalSum"></span></div>
    <div id="evalBanner"></div>
    <div class="grid-eval">
      <div class="card plist" id="plist"></div>
      <div id="editor"><div class="card muted">왼쪽에서 인원을 선택하세요.</div></div>
      <div class="side" id="side"></div>
    </div>`;
  if (AUTH.admin) $('#partSel').onchange = e => { if (STATE.dirty && !confirm('저장하지 않은 내용이 있습니다. 이동할까요?')) { e.target.value = STATE.part; return; } STATE.dirty = false; STATE.part = e.target.value; STATE.sel = null; viewEval(); };
  try {
    STATE.data = await api('getPart', { month: STATE.month, part: STATE.part });
  } catch (e) { toast(e.message, 1); return; }
  const d = STATE.data;
  const locked = d.locked && !AUTH.admin;
  $('#evalBanner').innerHTML = (d.locked ? `<div class="banner lock">🔒 ${d.month} 은(는) 마감되었습니다. ${AUTH.admin ? '관리자는 수정할 수 있습니다.' : '수정이 필요하면 관리자에게 요청하세요.'}</div>` : '') +
    (!d.list.some(x => x.data.hasData) ? `<div class="banner warn">이 달의 업무데이터가 아직 올라오지 않았습니다. 참고 점수가 비어 있어도 직접 입력은 가능합니다.</div>` : '');
  renderPList();
  if (keepSel && STATE.sel) selectPerson(STATE.sel, true);
  else if (d.list.length) selectPerson(d.list[0].person.name, true);
}

function recTotal(x) { return x.rec && x.rec['합계'] !== '' ? x.rec['합계'] : null; }

function renderPList() {
  const d = STATE.data;
  const done = d.list.filter(x => x.rec && x.rec['상태'] === '완료').length;
  $('#evalSum').textContent = `${d.month} · ${d.list.length}명 중 완료 ${done}명`;
  $('#plist').innerHTML = d.list.map(x => {
    const st = x.rec ? x.rec['상태'] : '';
    const b = st === '완료' ? '<span class="badge done">완료</span>' : st ? '<span class="badge draft">작성중</span>' : '<span class="badge">미작성</span>';
    const t = recTotal(x);
    return `<div class="pitem ${x.person.name === STATE.sel ? 'on' : ''}" data-n="${esc(x.person.name)}">
      <span class="nm">${esc(x.person.name)}</span>
      ${x.person.role === '파트장' ? '<span class="badge lead">파트장</span>' : ''}
      <span class="muted">${esc(x.person.grade || '-')}</span>
      ${t !== null ? `<span class="muted">${t}점</span>` : ''}${b}</div>`;
  }).join('') || '<div class="muted">인원이 없습니다. 관리자 → 명단에서 파트를 확인하세요.</div>';
  $('#plist').querySelectorAll('.pitem').forEach(el => el.onclick = () => selectPerson(el.dataset.n));
}

function curPerson() { return STATE.data.list.find(x => x.person.name === STATE.sel); }
function usedItems(items, person) {
  return items.filter(it => it.use && (it.target === '전체' || it.target === person.role));
}

function selectPerson(name, force) {
  if (!force && STATE.dirty && !confirm('저장하지 않은 내용이 있습니다. 다른 인원으로 이동할까요?')) return;
  STATE.dirty = false; STATE.sel = name;
  document.querySelectorAll('.pitem').forEach(el => el.classList.toggle('on', el.dataset.n === name));
  const x = curPerson(); if (!x) return;
  const d = STATE.data, p = x.person, rec = x.rec || {};
  const items = usedItems(d.items, p);
  const locked = d.locked && !AUTH.admin;
  const partInfo = META.parts.find(q => q.name === p.part) || {};
  const mgrs = [...new Set([...(META.managers || []), partInfo.manager].filter(Boolean))];
  const mgrVal = rec['관리자'] || partInfo.manager || '';
  const rows = items.map(it => {
    const k = it.no - 1, ref = x.refs[k], note = x.notes[k] || '';
    const val = rec['점수' + it.no] !== undefined && rec['점수' + it.no] !== '' ? rec['점수' + it.no] : '';
    const isMinus = it.sign < 0;
    return `<tr data-no="${it.no}">
      <td class="muted" style="width:70px">${esc(it.group)}</td>
      <td><b>${esc(it.name)}</b><div class="why">${esc(it.desc)}</div></td>
      <td style="width:58px;text-align:center">${isMinus ? '<span class="tag">감점</span>' : esc(it.max) + '점'}</td>
      <td style="width:96px;text-align:center"><input type="number" step="0.5" min="0" data-no="${it.no}" value="${esc(val)}" ${locked ? 'disabled' : ''} placeholder="${isMinus ? '감점' : '점수'}"></td>
      <td class="ref" style="width:210px">${ref === null ? '<span class="muted">참고 없음</span>' : `<b>${isMinus && ref ? '-' : ''}${ref}</b>${isMinus ? '' : '점'} <button class="small" data-apply="${it.no}" ${locked ? 'disabled' : ''}>적용</button>`}<div class="why">${esc(note)}</div></td>
    </tr>`;
  }).join('');
  $('#editor').innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row"><h2 style="margin:0">${esc(p.name)}</h2>
        <span class="badge">${esc(p.part)}</span><span class="badge ${p.role === '파트장' ? 'lead' : ''}">${esc(p.role)}</span>
        <span class="badge">등급 ${esc(p.grade || '없음')}</span>${p.memo ? `<span class="badge">${esc(p.memo)}</span>` : ''}
        ${rec['상태'] ? `<span class="badge ${rec['상태'] === '완료' ? 'done' : 'draft'}">${esc(rec['상태'])}</span>` : ''}</div>
      <div class="row"><button id="histBtn">지난 기록</button><button id="pvBtn">미리보기</button></div>
    </div>

function readScores() {
  const arr = new Array(SLOTS).fill('');
  document.querySelectorAll('#scoreBody input[data-no]').forEach(i => arr[+i.dataset.no - 1] = i.value);
  return arr;
}

function updTotals() {
  const x = curPerson(); if (!x) return;
  const items = usedItems(STATE.data.items, x.person);
  let t = 0, any = false;
  document.querySelectorAll('#scoreBody tr').forEach(tr => {
    const no = +tr.dataset.no, it = items.find(i => i.no === no);
    const v = num(tr.querySelector('input').value), ref = x.refs[no - 1];
    if (v !== null) { t += it.sign * v; any = true; }
    tr.classList.toggle('diff', v !== null && ref !== null && v !== ref);
  });
  $('#totalVal').textContent = any ? (Math.round(t * 10) / 10) + '점' : '-';
}

async function save(status) {
  const x = curPerson(); if (!x) return;
  const items = usedItems(STATE.data.items, x.person);
  const sc = readScores();
  if (status === '완료') {
    const empty = items.filter(it => it.sign > 0 && num(sc[it.no - 1]) === null);
    if (empty.length && !confirm(`비어 있는 점수가 있습니다: ${empty.map(i => i.name).join(', ')}\n그래도 작성 완료로 저장할까요?`)) return;
  }
  for (const it of items) {
    const v = num(sc[it.no - 1]);
    const mx = num(it.maxv !== null ? it.maxv : it.max);
    if (v !== null && v < 0) { toast(`${it.name}: 0 이상으로 입력하세요 (감점은 숫자만)`, 1); return; }
    if (v !== null && it.sign > 0 && mx !== null && v > mx) { toast(`${it.name}: 최대 ${mx}점입니다`, 1); return; }
  }
  const diffs = items.filter(it => { const v = num(sc[it.no - 1]), r = x.refs[it.no - 1]; return v !== null && r !== null && v !== r; });
  try {
    const r = await api('save', {
      month: STATE.data.month, name: x.person.name, scores: sc, status,
      fields: { 관리자: $('#fMgr').value, 업무평가1: $('#fW1').value, 업무평가2: $('#fW2').value, 건강관리: $('#fH').value, 특이사항: $('#fS').value }
    });
    x.rec = r.saved; STATE.dirty = false;
    renderPList(); selectPerson(x.person.name, true);
    toast(status === '완료' ? `작성 완료 저장됨 (합계 ${r.total}점)${diffs.length ? ` · 참고와 다른 칸 ${diffs.length}개` : ''}` : '임시 저장됨');
  } catch (e) { toast(e.message, 1); }
}

function modal(html) {

}

/* ---------- 미리보기 (엑셀 인사평가표 모양) ---------- */
function monthCols(month) { // 1~12월 고정 칼럼 → 해당 칸의 실제 연월
  const [y, m] = month.split('-').map(Number);
  return Array.from({ length: 12 }, (_, i) => { const mm = i + 1, yy = mm > m ? y - 1 : y; return { mm, key: `${yy}-${String(mm).padStart(2, '0')}`, last: yy < y }; });
}

function lineSvg(vals, color, fmt, min, max) {
  const W = 560, H = 245, L = 46, R = 14, T = 34, B = 26, iw = W - L - R, ih = H - T - B;
  const nums = vals.filter(v => v !== null);
  if (min === undefined) { const lo = nums.length ? Math.min(...nums) : 0, hi = nums.length ? Math.max(...nums) : 1; min = Math.floor(lo - 1); max = Math.ceil(hi + 1); }
  const step = (max - min) / 5;
  const x = i => L + iw * (i + 0.5) / 12, y = v => T + ih * (1 - (v - min) / (max - min));
  let g = '';
  for (let k = 0; k <= 5; k++) { const v = min + step * k, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#dfe3e6"/><text x="${L - 4}" y="${yy + 3}" font-size="9" text-anchor="end" fill="#555">${fmt(v)}</text>`; }
  for (let i = 0; i < 12; i++) g += `<text x="${x(i)}" y="${H - 8}" font-size="9" text-anchor="middle" fill="#555">${i + 1}월</text>`;
  let path = '', dots = '';
  vals.forEach((v, i) => { if (v === null) return; path += (path ? 'L' : 'M') + x(i) + ' ' + y(v) + ' '; dots += `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${color}"/><text x="${x(i)}" y="${y(v) - 7}" font-size="9" text-anchor="middle">${fmt(v)}</text>`; });
  return { g, path, dots, W, H };
}

  <div class="pv">

/* =====================================================================
   관리자 — 데이터 올리기
   ===================================================================== */
const normH = s => String(s === null || s === undefined ? '' : s).replace(/\s+/g, '');
function findHeader(aoa, must) {
  for (let r = 0; r < Math.min(aoa.length, 40); r++) {
    const row = (aoa[r] || []).map(normH);
    if (must.every(m => row.some(c => c === m))) return r;
  }
  return -1;
}
function colMap(row) { const m = {}; row.forEach((c, i) => { const k = normH(c); if (k && m[k] === undefined) m[k] = i; }); return m; }

function parseWork(ws) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const hr = findHeader(aoa, ['이름', '평가평균']);
  if (hr < 0) throw new Error('"이름", "평가평균" 제목이 있는 줄을 찾지 못했습니다. 업무데이터 시트가 맞는지 확인하세요.');
  const m = colMap(aoa[hr]);
  const pick = (row, ...keys) => { for (const k of keys) if (m[k] !== undefined) return row[m[k]]; return ''; };
  const out = {}, order = [];
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r]; const name = String(pick(row, '이름') || '').trim();
    if (!name || name === '이름' || /^[\d.]+$/.test(name)) continue;
    const k = normH(name); if (out[k]) continue;
    let ach = num(pick(row, '달성_%', '달성율', '달성률')); if (ach !== null && ach > 3) ach = ach / 100;
    out[k] = {
      이름: name, 원본그룹: pick(row, '그룹'), 직위: pick(row, '직위'), 조립수량: num(pick(row, '조립수량')), 목표수량: num(pick(row, '목표수량')),
      평가평균: num(pick(row, '평가평균')), 실제평균: num(pick(row, '실제평균')), 근무일수: num(pick(row, '총근무일', '근무일')), 총량: num(pick(row, '총량(환산)', '총량')),
      달성률: ach, 순위: num(pick(row, '순위(평가)')), 조퇴: num(pick(row, '조퇴')), 지각: num(pick(row, '지각')), 당일연차: num(pick(row, '당일연차')),
      결근: num(pick(row, '결근')), 지시불이행: num(pick(row, '지시불이행')), 원본등급: pick(row, '등급'),
      품질지적: 0, 미발송: 0, 오발송: 0, 오조립: 0, 파손: 0
    };
    order.push(k);
  }
  return { rows: out, order };
}

const ACC_KINDS = { '품질지적': '품질지적', '지시불이행': '지시불이행', '미발송': '미발송', '오발송': '오발송', '오배송': '오발송', '오조립': '오조립', '파손': '파손' };
function parseAcc(ws) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const hr = findHeader(aoa, ['이름', '구분']);
  if (hr < 0) throw new Error('"이름", "구분" 제목이 있는 줄을 찾지 못했습니다. 사고 시트가 맞는지 확인하세요.');
  const m = colMap(aoa[hr]); const out = {}; let n = 0;
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r]; const name = String(row[m['이름']] || '').trim(); const kind = ACC_KINDS[normH(row[m['구분']])];
    if (!name || !kind) continue;
    const k = normH(name); out[k] = out[k] || { 이름: name }; out[k][kind] = (out[k][kind] || 0) + 1; n++;
  }
  return { rows: out, count: n };
}

    <div class="fields" style="grid-template-columns:160px 1fr 1fr">

  const setup = (fileSel, sheetSel, key, prefer) => {
    $(fileSel).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });

        s.onchange = preview; preview();
      } catch (err) { toast('파일을 읽지 못했습니다: ' + err.message, 1); }
    };
  };
  let merged = null;
  const preview = () => {
    merged = null; $('#upBtn').disabled = true;
    const box = $('#upPreview');
    try {
      if (!books.work) { box.innerHTML = '<div class="muted">업무통계 엑셀을 선택하세요.</div>'; return; }
      const w = parseWork(books.work.Sheets[$('#upWorkSheet').value]);
      let accInfo = '';
      if (books.acc) {
        const a = parseAcc(books.acc.Sheets[$('#upAccSheet').value]);
        Object.keys(a.rows).forEach(k => {
          if (!w.rows[k]) { w.rows[k] = { 이름: a.rows[k].이름, 품질지적: 0, 미발송: 0, 오발송: 0, 오조립: 0, 파손: 0 }; w.order.push(k); }
          ['품질지적', '미발송', '오발송', '오조립', '파손'].forEach(t => w.rows[k][t] = a.rows[k][t] || 0);
          if (a.rows[k].지시불이행) w.rows[k].지시불이행 = Math.max(w.rows[k].지시불이행 || 0, a.rows[k].지시불이행);
        });
        accInfo = ` · 사고 ${a.count}건 (${Object.keys(a.rows).length}명)`;
      }
      merged = w.order.map(k => w.rows[k]);
      const sample = merged.slice(0, 8);
      box.innerHTML = `<div class="banner info">인원 ${merged.length}명 읽음${accInfo}. 아래는 앞부분 미리보기입니다.</div>
        <div class="scroll"><table><tr><th>이름</th><th>그룹</th><th>평가평균</th><th>총량</th><th>목표</th><th>근무일</th><th>지각</th><th>조퇴</th><th>결근</th><th>품질지적</th><th>미/오발송</th><th>오조립</th><th>파손</th></tr>

    const month = $('#upMonth').value.trim();

    if (!merged) return;
    if (!confirm(`${month} 업무데이터 ${merged.length}명을 올립니다. 이 달에 이미 올린 데이터가 있으면 새 데이터로 바뀝니다.`)) return;
    try {
      const r = await api('upload', { month, rows: merged });
      $('#upPreview').innerHTML = `<div class="banner info">${r.month} 올리기 완료 · ${r.count}명</div>` +
        (r.missing.length ? `<div class="banner warn">명단에는 있는데 업무데이터에 없는 인원 ${r.missing.length}명: ${r.missing.map(esc).join(', ')}<br>이름이 다르게 적혀 있으면 명단의 "원본이름" 칸에 업무데이터의 이름을 적어주세요.</div>` : '');
      META = (await api('login')).meta; STATE.month = month; buildMonthSel();
      toast('올리기 완료');
    } catch (e) { toast(e.message, 1); }
  };
}

/* =====================================================================
   관리자 — 기준 설정 / 명단·파트 (편집 표)
   ===================================================================== */
let CFG = null;
async function loadCfg() { CFG = await api('getConfig'); return CFG; }

const COL_OPTS = {
  '사용': ['Y', 'N'], '계산방식': ['목표수량', '성장', '순위표', '품질감점', '근태감점', '수동'], '합산': ['더하기', '빼기'], '대상': ['전체', '사원', '파트장'],
  '직책': ['사원', '파트장'], '등급': ['', 'A', 'B', 'C', 'D'], '구분@감점기준': ['품질', '근태']
};

function rowHtml(table, r, opts = {}) {
  const cols = opts.cols || CFG.headers[table];
  const cell = h => {
    let o = COL_OPTS[h + '@' + table] || COL_OPTS[h];
    if (h === '파트' && table === '명단') o = ['', ...CFG['파트'].map(p => p['파트'])];
    const v = r[h] === undefined ? '' : r[h];
    const w = (opts.w && opts.w[h]) || 90;
    if (opts.readonly && opts.readonly.includes(h)) return `<td><input type="text" data-h="${h}" value="${esc(v)}" readonly style="background:#f7f7f7;width:${w}px"></td>`;
    if (o) return `<td><select data-h="${h}">${[...new Set([...o, v])].map(x => `<option ${String(x) === String(v) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></td>`;
    return `<td><input type="text" data-h="${h}" value="${esc(v)}" style="width:${w}px"></td>`;
  };
  return `<tr>${cols.map(cell).join('')}${opts.fixed ? '' : '<td><button class="small danger" data-del>삭제</button></td>'}</tr>`;
}

function editTable(table, rows, opts = {}) {
  const cols = opts.cols || CFG.headers[table];
  return `<div class="scroll"><table class="edit" id="ed_${table}"><tr>${cols.map(h => `<th>${esc(h)}</th>`).join('')}${opts.fixed ? '' : '<th></th>'}</tr>
    ${rows.map(r => rowHtml(table, r, opts)).join('')}</table></div>
  ${opts.fixed ? '' : `<button class="small" data-add="${table}" style="margin-top:6px">+ 줄 추가</button>`}`;
}

function wireTable(table, opts = {}) {
  const t = $('#ed_' + table);
  const bindDel = root => root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => b.closest('tr').remove());
  bindDel(t);
  const add = document.querySelector(`[data-add="${table}"]`);
  if (add) add.onclick = () => {
    const tb = t.tBodies[0] || t;
    tb.insertAdjacentHTML('beforeend', rowHtml(table, opts.blank || {}, opts));
    bindDel(tb.lastElementChild);
    const f = tb.lastElementChild.querySelector('input'); if (f) f.focus();
  };
}

function readTable(table, opts = {}) {
  const cols = opts.cols || CFG.headers[table];
  const H = CFG.headers[table];
  const orig = opts.keep ? CFG[table] : [];
  return [...$('#ed_' + table).querySelectorAll('tr')].slice(1).map((tr, i) => {
    const o = {}; H.forEach(h => o[h] = (orig[i] && orig[i][h]) || '');
    tr.querySelectorAll('[data-h]').forEach(el => o[el.dataset.h] = el.value.trim());
    return o;
  });
}

async function saveTable(table, rows) {
  try { await api('saveConfig', { table, rows }); toast(table + ' 저장 완료'); await loadCfg(); META = (await api('login')).meta; return true; }
  catch (e) { toast(e.message, 1); return false; }
}

    const m = $('#stMonth').value.trim();

    if (await saveTable('설정', rows)) { AUTH.pw = pw; try { sessionStorage.setItem('auth', JSON.stringify(AUTH)); } catch (e) {} }
  };
}

  '업무평가', '건강관리', '특이사항', '총수량', '총수량순위', '일평균', '평균순위', '개인목표', '전월평균', '근무일수', '당일연차', '지각', '조퇴', '결근',
  '품질지적', '지시불이행', '미오발송', '오조립', '파손', '상태'];

      <button class="primary" id="dlBtn">이 달 엑셀 받기</button><button id="dlAll">전체 기록 받기</button></div></div>`;
  main.querySelectorAll('[data-lock]').forEach(b => b.onclick = async () => {

async function downloadMonth(month) {
  let d; try { d = await api('getAll', { month }); } catch (e) { toast(e.message, 1); return; }
  const rows = d.list.map((x, i) => {
    const r = x.rec || {}, dt = x.data;
    const o = { No: i + 1, 이름: x.person.name, 파트: x.person.part, 직책: x.person.role, 등급: x.person.grade, 평가월: month };
    for (let k = 1; k <= SLOTS; k++) o['점수' + k] = r['점수' + k] === undefined ? '' : r['점수' + k];
    o.합계 = r['합계'] ?? '';
    o.관리자 = r['관리자'] || '';
    o.월목표 = dt.개인목표 ?? ''; o.결과 = dt.일평균 === null ? '' : Math.round(dt.일평균 * 100) / 100; o.달성률 = dt.달성률 === null ? '' : Math.round(dt.달성률 * 1000) / 1000;
    o.업무평가 = [r['업무평가1'], r['업무평가2']].filter(Boolean).join('\n'); o.건강관리 = r['건강관리'] || ''; o.특이사항 = r['특이사항'] || '';
    const rd = (v, n) => v === null || v === undefined ? '' : Math.round(v * 10 ** n) / 10 ** n;
    o.총수량 = rd(dt.총수량, 1); o.총수량순위 = dt.총수량순위 ?? ''; o.일평균 = rd(dt.일평균, 2); o.평균순위 = dt.평균순위 ?? ''; o.개인목표 = dt.개인목표 ?? ''; o.전월평균 = rd(dt.전월평균, 2);
    ['근무일수', '당일연차', '지각', '조퇴', '결근', '품질지적', '지시불이행', '미오발송', '오조립', '파손'].forEach(k => o[k] = dt[k] ?? '');
    o.상태 = r['상태'] || '미작성';
    return o;
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows, { header: EXPORT_COLS });
  ws['!cols'] = EXPORT_COLS.map(h => ({ wch: ['업무평가', '건강관리', '특이사항'].includes(h) ? 40 : h.length < 4 ? 8 : 11 }));
  XLSX.utils.book_append_sheet(wb, ws, '데이터');
  const items = d.items.map(it => ({ 칸: '점수' + it.no, 사용: it.use ? 'Y' : 'N', 구분: it.group, 항목명: it.name, 배점: it.max, 합산: it.sign < 0 ? '빼기' : '더하기', 평가기준: it.desc }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(items), '항목설정');
  const [y, m] = month.split('-');
  XLSX.writeFile(wb, `인사평가_${y.slice(2)}년${+m}월.xlsx`);
}

async function downloadAll() {
  let all; try { all = await api('exportAll'); } catch (e) { toast(e.message, 1); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(all.map(r => { const o = Object.assign({}, r); delete o._row; delete o['항목설정']; return o; })), '평가기록');
  XLSX.writeFile(wb, '인사평가_전체기록.xlsx');
}

/* =====================================================================
   관리자 — 기록 가져오기 (9월까지 인사보고 파일)
   ===================================================================== */
function viewImport() {
  const main = $('#main');
  main.innerHTML = `<div class="card"><h2>지난 기록 가져오기</h2>
    <div class="banner info">9월까지 쓰던 인사보고 엑셀(조립팀_인사평가.xlsm)의 "데이터_이력" 시트를 읽어서, 월별 총점·항목 점수·일평균·면담을 평가기록에 넣습니다. "구 기준"으로 표시되어 새 기준과 섞이지 않습니다. 이 기록이 있으면 10월 "전월평균"(성장 점수)과 1~12월 이력에 바로 쓰입니다.</div>
    <input type="file" id="imFile" accept=".xlsx,.xlsm">
    <label class="row" style="margin-top:10px"><input type="checkbox" id="imOver" style="width:auto"> 이미 있는 달·인원 기록도 덮어쓰기</label>
    <div id="imPrev" style="margin-top:12px"></div>
    <div class="actions"><button class="primary" id="imBtn" disabled>가져오기</button></div></div>`;
  let rows = null;
  $('#imFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
      const sn = wb.SheetNames.find(n => n.includes('데이터_이력'));
      if (!sn) throw new Error('"데이터_이력" 시트가 없습니다');
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
      const hr = findHeader(aoa, ['이름', '평가월']);
      if (hr < 0) throw new Error('제목 줄을 찾지 못했습니다');
      const hdr = aoa[hr].map(normH);
      const find = pre => hdr.findIndex(h => h.startsWith(pre));
      const ix = { 이름: find('이름'), 조립능력: find('조립능력'), 조립점유율: find('조립점유율'), 조립품질: find('조립품질'), 근태개인관리: find('근태'), 소계: find('소계'),
        업무내용: find('업무내용'), 건강관리: find('건강관리'), 특이사항: find('특이사항'), 그룹: find('그룹'), 평가월: find('평가월'), 총수량: find('총수량'),
        총수량순위: find('총수량순위'), 일평균: find('일평균'), 일평균순위: find('일평균순위'), 개인목표: find('개인목표'), 달성율: find('달성율'),
        품질지적: find('품질지적'), 지시불이행: find('지시불이행'), 미오발송: find('미오발송'), 오조립: find('오조립'), 파손: find('파손'),
        근무일수: find('근무일수'), 당일연차: find('당일연차'), 지각: find('지각'), 조퇴: find('조퇴') };
      rows = [];
      for (let r = hr + 1; r < aoa.length; r++) {
        const a = aoa[r]; if (!a[ix.이름]) continue;
        const o = {};
        Object.keys(ix).forEach(k => { if (ix[k] >= 0) { let v = a[ix[k]]; if (v instanceof Date) v = `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}`; o[k] = v; } });
        if (typeof o.평가월 === 'number') { const dt = new Date(Math.round((o.평가월 - 25569) * 86400000)); o.평가월 = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}`; }
        rows.push(o);
      }
      const byM = {}; rows.forEach(r => byM[r.평가월] = (byM[r.평가월] || 0) + 1);
      $('#imPrev').innerHTML = `<div class="banner info">${rows.length}줄 읽음</div><table style="max-width:420px"><tr><th>평가월</th><th>인원</th></tr>${Object.keys(byM).sort().map(m => `<tr><td>${esc(m)}</td><td>${byM[m]}</td></tr>`).join('')}</table>`;
      $('#imBtn').disabled = false;
    } catch (err) { $('#imPrev').innerHTML = `<div class="banner lock">${esc(err.message)}</div>`; }
  };
  $('#imBtn').onclick = async () => {
    if (!rows) return;
    if (!confirm(`${rows.length}줄을 평가기록에 넣을까요?`)) return;
    try { const r = await api('importHistory', { rows, overwrite: $('#imOver').checked }); $('#imPrev').innerHTML = `<div class="banner info">완료 · 추가 ${r.added} · 덮어씀 ${r.updated} · 건너뜀 ${r.skipped}</div>`; META = (await api('login')).meta; buildMonthSel(); }
    catch (e) { toast(e.message, 1); }
  };
}
